  <meta name="description" content="Create your onlinemanagement.site account with a global, mobile-friendly sign-up experience.">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <a class="brand" href="index.html" aria-label="Online Management home">

      </span>

    </a>

    <section class="signup-card" aria-labelledby="signup-title">
      <div class="card-heading">

        <h1 id="signup-title">Create your account</h1>
        <p>One simple sign-up, wherever you are in the world.</p>
      </div>

      <button class="google-button" id="googleSignIn" type="button">

        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="divider" role="separator" aria-label="Or continue with your phone">
        <span>or</span>
      </div>

          <span class="field-separator" aria-hidden="true"></span>
          <input
            id="phoneNumber"
            name="phoneNumber"
            type="tel"
            inputmode="tel"
            autocomplete="tel-national"
            placeholder="Enter phone number"
            aria-describedby="phoneHint authMessage"
            required
          >
        </div>


        <div id="recaptcha-container" aria-label="reCAPTCHA verification"></div>

        <button class="phone-button" type="submit">
          <span>Continue with Phone</span>
          <svg class="btn-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4.167 10h11.666M10 4.167 15.833 10 10 15.833" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

      <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>

      <p class="legal-copy">
        By continuing, you agree to our <a href="index.html#terms">Terms of Service</a>

    <footer class="page-footer">
      <span>© <span id="currentYear"></span> Online Management Site</span>
